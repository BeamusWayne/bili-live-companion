name: Windows desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Build and validate the Windows app
        shell: pwsh
        run: ./build_windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: Bili-Companion-Windows-x64
          if-no-files-found: error
          path: |
            dist/bilibili-drops-miner-gui.exe
            dist/windows-smoke-result.json
            docs/windows.md
            LICENSE
